<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bot - Pairing Code</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { background-color: #25D366; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 95%; }
        button:hover { background-color: #128C7E; }
        #codeDisplay { margin-top: 20px; font-size: 24px; font-weight: bold; color: #075E54; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Unganisha WhatsApp Bot</h2>
    <p>Ingiza namba ya simu kuanza na namba ya nchi (Mfano: 255712345678)</p>
    <input type="text" id="phoneNumber" placeholder="2557XXXXXXXX">
    <button onclick="getPairingCode()">Omba Pairing Code</button>
    <div id="codeDisplay"></div>
</div>

<script>
    async function getPairingCode() {
        const phone = document.getElementById('phoneNumber').value.trim();
        const codeDisplay = document.getElementById('codeDisplay');
        
        if (!phone) {
            alert('Tafadhali ingiza namba ya simu!');
            return;
        }

        codeDisplay.innerText = "Inatengeneza kodi...";

        try {
            const response = await fetch(`/api/pair?phone=${phone}`);
            const data = await response.json();
            
            if (data.code) {
                codeDisplay.innerText = data.code;
            } else {
                codeDisplay.innerText = "Imeshindikana. Jaribu tena.";
            }
        } catch (error) {
            codeDisplay.innerText = "Hitilafu imetokea!";
        }
    }
</script>

</body>
</html>
